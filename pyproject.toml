[project]
name = "gmr-pdf"
version = "0.1.0"
description = "Leitura e extração de dados de arquivos PDF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "google-api-python-client>=2.200.0",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmr_pdf"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src/gmr_pdf --cov-report=term-missing"

[tool.coverage.run]
source = ["src/gmr_pdf"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "def __repr__"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ANN"]
allowed-confusables = ["ℹ", "⚠", "×"]  # emojis do logging + tipografia × em docs

[tool.ruff.lint.isort]
known-first-party = ["gmr_pdf"]
