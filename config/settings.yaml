# =============================================================================
# Configurações não sensíveis do projeto gmr_pdf
# Segredos e identificadores ficam no .env (não versionado)
# Domínio das famílias de tabelas: config/families/<nome>.yaml
# =============================================================================

app:
  name: "gmr_pdf"
  version: "0.1.0"
  environment: "development"

google_drive:
  api_service: "drive"
  api_version: "v3"
  scopes:
    - "https://www.googleapis.com/auth/drive.readonly"
  download_chunk_size_bytes: 10485760  # 10 MB (múltiplo de 256 KB, exigido pela API)
  list_page_size: 100

logging:
  level: "INFO"
  timezone: "America/Sao_Paulo"  # UTC-3
  date_format: "%Y-%m-%d %H:%M:%S %z"

spatial:
  profile_resolution_pt: 1.0  # resolução da varredura de projeção, em pontos
  row_band_factor: 0.15       # tolerância p/ agrupar baselines na mesma linha (× altura mediana do span)

freight:
  default_family: "magalu_escalonada"  # perfil default; outras famílias em config/families/
